name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    # 1. Khai báo chiến lược Matrix (Matrix Strategy)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    # 2. Thay vì dùng hệ điều hành cố định, ta gọi biến từ matrix
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (Test and Package)
        run: mvn clean test package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          # Gắn tên OS vào artifact để phân biệt file tải về của OS nào
          name: bank-system-jar-${{ matrix.os }}
          path: target/*.jar
